# LogScale (CQL) NL-to-query resources server
#
# Prerequisites:
#   bash setup.sh   # starts container, ingests synthetic_falcon_events.csv
#
# Engine options:
#   container  – execute CQL against a live LogScale instance (default)
#   local      – execute CQL against a pandas DataFrame (requires logscale_evaluations/cql_engine.py)
logscale_cql:
  resources_servers:
    logscale_cql:
      entrypoint: app.py
      domain: knowledge
      engine: container                    # "container" or "local"
      logscale_url: http://localhost:8080
      # repository: sandbox_xxx            # auto-detected if omitted
      # csv_path: data/synthetic_falcon_events.csv   # only needed for engine=local
      # judge_model_server:
      #   type: responses_api_models
      #   name: policy_model
      # judge_responses_create_params:
      #   model: your-judge-model
      #   max_output_tokens: 512
      #   temperature: 0
